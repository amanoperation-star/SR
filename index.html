    <script>
      // Cleanly intercept Vite HMR WebSockets and suppress transport errors in dev environment
      (function() {
        // 1. Suppress console.error for any vite transport messages
        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) { return String((a && a.stack) ? a.stack : a); }).join(' ');
          if (
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('[vite] failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1 ||
            str.indexOf('vite:ws:disconnect') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, args);
        };

        // 2. Global event listeners for uncaught errors / rejections
        window.addEventListener('unhandledrejection', function(e) {
          var msg = (e && e.reason && (e.reason.message || e.reason.stack || String(e.reason))) || '';
          if (
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // 3. Mock WebSocket for Vite HMR to prevent transport failures
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              urlStr.indexOf('vite-hmr') !== -1 ||
              urlStr.indexOf('token=') !== -1;

            if (isViteHmr) {
              var listeners = {};
              var fakeWs = {
                readyState: 1, // OPEN
                url: urlStr,
                protocol: 'vite-hmr',
                extensions: '',
                binaryType: 'blob',
                bufferedAmount: 0,
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { fn.call(fakeWs, new Event('open')); } catch(err) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(f) { return f !== fn; });
                },
                dispatchEvent: function(evt) {
                  var list = listeners[evt.type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i].call(fakeWs, evt); } catch(err) {}
                  }
                  return true;
                },
                send: function() {},
                close: function() {
                  this.readyState = 3;
                },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };

              setTimeout(function() {
                if (typeof fakeWs.onopen === 'function') {
                  fakeWs.onopen(new Event('open'));
                }
              }, 0);

              return fakeWs;
            }

            return new NativeWebSocket(url, protocols);
          };

          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = NativeWebSocket.prototype;
        }
      })();
    </script>
